# Website only. Keep the separate application and backend out of this publish directory.
[build]
  base = "."
  command = "npm run build:public"
  publish = "frontend/dist-public"

[build.environment]
  NODE_VERSION = "22"

# DNS and domain activation remain separate, owner-approved operations.
[[redirects]]
  from = "https://www.kailor.co.za/*"
  to = "https://kailor.co.za/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.kailor.co.za/*"
  to = "https://kailor.co.za/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/faqs"
  to = "/questions"
  status = 301

[[redirects]]
  from = "/timeline"
  to = "/"
  status = 301

[[redirects]]
  from = "/pricing"
  to = "/"
  status = 301

# There is deliberately no API proxy or SPA catch-all into the application.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
